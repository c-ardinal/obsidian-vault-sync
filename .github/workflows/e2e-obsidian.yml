name: Obsidian UI check

# Starts the real Obsidian desktop app (Linux AppImage) with the built plugin,
# drives the settings tab and the plugin's other screens (modals, notices, menus)
# through the DevTools protocol and saves screenshots.
on:
    pull_request:
        paths:
            - "src/**"
            - "styles.css"
            # The release build (CSS minifier, bundling) is what the check runs
            - "rollup.config.js"
            - "minify-css.mjs"
            - "e2e/obsidian/**"
            - ".github/workflows/e2e-obsidian.yml"
            - "package-lock.json"
    workflow_dispatch:
        inputs:
            obsidian_version:
                description: "Obsidian version (empty = latest)"
                required: false

permissions:
    contents: read

jobs:
    obsidian-ui:
        runs-on: ubuntu-latest
        # Room for a slow package mirror (the apt step once took 13 minutes); the
        # steps that can hang have their own, tighter limits
        timeout-minutes: 30
        env:
            OBSIDIAN_VERSION: ${{ inputs.obsidian_version }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build plugin
              run: npx rollup -c --environment BUILD:production

            - name: Install display and fonts
              timeout-minutes: 15
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq xvfb fonts-noto-cjk libnss3 libgbm1 libasound2t64 libgtk-3-0t64 libxss1 >/dev/null

            - name: Cache Obsidian
              uses: actions/cache@v4
              with:
                  path: .obsidian-cache
                  key: obsidian-${{ inputs.obsidian_version || 'latest' }}-${{ github.run_id }}
                  restore-keys: obsidian-${{ inputs.obsidian_version || 'latest' }}-

            - name: Download Obsidian
              run: echo "OBSIDIAN_BIN=$(node e2e/obsidian/setup-obsidian.mjs | tail -n 1)" >> "$GITHUB_ENV"

            - name: Download add-on package (for the install review screen)
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  repo=c-ardinal/obsidian-vault-sync-e2ee-engine
                  tag=$(gh release list --repo "$repo" -L 1 --json tagName -q '.[0].tagName' || true)
                  if [ -n "$tag" ] && gh release download "$tag" --repo "$repo" --pattern 'vault-sync-e2ee-engine.zip' -D .addon-pkg; then
                      echo "ADDON_ZIP=$PWD/.addon-pkg/vault-sync-e2ee-engine.zip" >> "$GITHUB_ENV"
                  fi

            - name: Run UI check
              timeout-minutes: 15
              run: xvfb-run -a --server-args="-screen 0 1920x1080x24" node e2e/obsidian/run.mjs

            - name: Summary
              if: ${{ !cancelled() }}
              run: cat test-results/e2e-obsidian/summary.md >> "$GITHUB_STEP_SUMMARY" || true

            - name: Upload screenshots
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-obsidian-screenshots
                  path: test-results/e2e-obsidian/
                  if-no-files-found: ignore
                  retention-days: 14

