name: Obsidian UI check

# Starts the real Obsidian desktop app (Linux AppImage) with the built plugin,
# drives the settings tab through the DevTools protocol and saves screenshots.
on:
    pull_request:
        paths:
            - "src/**"
            - "styles.css"
            - "e2e/obsidian/**"
            - ".github/workflows/e2e-obsidian.yml"
            - "package-lock.json"
    workflow_dispatch:
        inputs:
            obsidian_version:
                description: "Obsidian version (empty = latest)"
                required: false

permissions:
    contents: read

jobs:
    obsidian-ui:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            OBSIDIAN_VERSION: ${{ inputs.obsidian_version }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build plugin
              run: npx rollup -c

            - name: Install display and fonts
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq xvfb fonts-noto-cjk libnss3 libgbm1 libasound2t64 libgtk-3-0t64 libxss1 >/dev/null

            - name: Cache Obsidian
              uses: actions/cache@v4
              with:
                  path: .obsidian-cache
                  key: obsidian-${{ inputs.obsidian_version || 'latest' }}-${{ github.run_id }}
                  restore-keys: obsidian-${{ inputs.obsidian_version || 'latest' }}-

            - name: Download Obsidian
              run: echo "OBSIDIAN_BIN=$(node e2e/obsidian/setup-obsidian.mjs | tail -n 1)" >> "$GITHUB_ENV"

            - name: Run UI check
              run: xvfb-run -a --server-args="-screen 0 1920x1080x24" node e2e/obsidian/run.mjs

            - name: Summary
              if: ${{ !cancelled() }}
              run: cat test-results/e2e-obsidian/summary.md >> "$GITHUB_STEP_SUMMARY" || true

            - name: Upload screenshots
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-obsidian-screenshots
                  path: test-results/e2e-obsidian/
                  if-no-files-found: ignore
                  retention-days: 14

