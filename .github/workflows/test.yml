name: Pull Request Test

on:
    push:
        branches: [main, master, develop]
    pull_request:
        branches: [main, master, develop]

jobs:
    test:
        name: Test on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                node-version: [20.x]

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            # `npm run build` (the local build) stamps manifest.json with a build hash.
            # A stamped version must never be merged: the release needs plain x.y.z.
            - name: Check release versions
              shell: bash
              run: |
                  VERSION=$(node -p "require('./manifest.json').version")
                  if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                      echo "::error::manifest.json version '$VERSION' is not x.y.z"
                      exit 1
                  fi
                  if [ "$(node -p "require('./package.json').version")" != "$VERSION" ]; then
                      echo "::error::package.json and manifest.json versions differ"
                      exit 1
                  fi
                  if [ "$(node -p "require('./versions.json')['$VERSION'] || ''")" = "" ]; then
                      echo "::error::versions.json has no entry for $VERSION"
                      exit 1
                  fi

            - name: Run tests
              run: npx vitest run --coverage --reporter=verbose --reporter=junit --outputFile=test-report.junit.xml

            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/lcov.info

            - name: Upload test results to Codecov
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: test-report.junit.xml
                  report_type: test_results

    simulation:
        name: Multi-device simulation on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js 20.x
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            # Deterministic, minimized reproductions of known multi-device bugs.
            # Fails when a bug stops reproducing (= fixed) so it gets promoted to a regression test.
            - name: Harness self-tests, known-bug scenarios and OS name differences
              run: npx vitest run --config vitest.sim.config.ts tests/sim/harness.test.ts tests/sim/known-bugs.test.ts tests/sim/os-names.test.ts

            # Randomized multi-device runs. Non-blocking until the known bugs are fixed:
            # results are shown in the job summary and uploaded as an artifact.
            # Set the repository variable SIM_STRICT=true to make failures block the PR.
            - name: Randomized simulation (10 seeds per scenario)
              id: sim
              continue-on-error: ${{ vars.SIM_STRICT != 'true' }}
              env:
                  SIM_SEEDS: 10
                  SIM_SEED_BASE: 1
              run: npx vitest run --config vitest.sim.config.ts tests/sim/multi-device.sim.test.ts --reporter=dot

            - name: Simulation summary
              if: ${{ !cancelled() }}
              shell: bash
              env:
                  SIM_SUMMARY_TITLE: "Multi-device simulation (${{ matrix.os }})"
              run: node tests/sim/summarize.mjs >> "$GITHUB_STEP_SUMMARY"

            - name: Upload simulation reports
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: sim-reports-${{ matrix.os }}
                  path: test-results/sim/
                  if-no-files-found: ignore
                  retention-days: 14

    formal:
        name: TLA+ model checking
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js 20.x
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x

            - name: Use Java 17
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Cache tla2tools.jar
              uses: actions/cache@v4
              with:
                  path: formal/.cache
                  key: tla2tools-${{ hashFiles('formal/run.mjs') }}

            # Current code must pass every model; earlier code and rejected designs must
            # still break the named property (see formal/README.md)
            - name: Check the models
              run: node formal/run.mjs

    browser:
        name: Browser engines (Chromium, WebKit)
        # Playwright 1.56 has no browsers for ubuntu-latest (26.04) yet
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js 20.x
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Install Chromium and WebKit
              run: npx playwright-core install --with-deps chromium webkit

            # Built from the add-on commit pinned in approved-addons.ts, so the tests
            # do not depend on which add-on release is the latest
            - name: Cache the approved add-on package
              uses: actions/cache@v4
              with:
                  path: .addon-pkg
                  key: addon-pkg-${{ hashFiles('src/addons/approved-addons.ts', 'e2e/prepare-approved-addon.mjs') }}

            - name: Prepare the approved add-on package
              timeout-minutes: 10
              run: node e2e/prepare-approved-addon.mjs

            # The shipped Drive adapter over XMLHttpRequest, and the add-on loader, in
            # Chromium (desktop, Android) and WebKit (iPhone, iPad), cross-origin like
            # googleapis.com from the Obsidian app
            - name: Run browser tests
              run: npx vitest run --config vitest.browser.config.ts
